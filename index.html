<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunday Super League — Season 2</title>
  <style>
    :root {
      --bg: #070b09;
      --bg2: #0b1712;
      --card: #101d16;
      --card-2: #132419;
      --line: rgba(237,239,234,0.08);
      --text: #edf0eb;
      --text-dim: #93a29a;
      --text-faint: #5e6d66;
      --gold: #c9a24b;
      --cyan: #39d2c0;
      --danger: #c1443c;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
    }
    .hero {
      padding: 40px 20px 24px;
      background: linear-gradient(180deg, #040807, #0c1411 65%, #070b09);
      border-bottom: 1px solid var(--line);
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(36px, 5vw, 60px);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hero .sub {
      display: block;
      color: var(--gold);
      font-size: 0.44em;
      margin-top: 8px;
      letter-spacing: 0.08em;
    }
    .hero-meta {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
    }
    .hero-meta div {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hero-meta .n {
      font-weight: 700;
      color: var(--cyan);
      font-size: 22px;
    }
    .hero-meta .l {
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .section {
      margin-top: 30px;
    }
    .section-head {
      margin-bottom: 16px;
    }
    .section-head h2 {
      margin: 0;
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .section-head p {
      margin: 6px 0 0;
      color: var(--text-dim);
      font-size: 13px;
    }
    .logo-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 16px;
    }
    @media (max-width: 980px) {
      .logo-grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
    }
    @media (max-width: 560px) {
      .logo-grid { grid-template-columns: 1fr; }
    }
    .team-card {
      background: linear-gradient(160deg, var(--card-2), var(--card));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 120px;
    }
    .team-badge {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #f5f3ec;
      border: 2px solid rgba(255,255,255,0.25);
      box-shadow: inset 0 0 18px rgba(255,255,255,0.14);
    }
    .team-card .meta {
      min-width: 0;
    }
    .team-card .meta .club {
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .team-card .meta .player {
      font-size: 18px;
      font-weight: 700;
      margin-top: 6px;
    }
    .fixture-list {
      display: grid;
      gap: 12px;
    }
    .fixture-pair {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .fixture-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      color: var(--text-dim);
      font-size: 14px;
    }
    .fixture-match {
      display: grid;
      grid-template-columns: 1fr 120px 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    .fixture-match:last-child { border-bottom: none; }
    .team-side {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .team-side.away {
      justify-content: flex-end;
      flex-direction: row-reverse;
      text-align: right;
    }
    .team-side .name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .score {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 18px;
    }
    .score .box {
      min-width: 32px;
      padding: 6px 8px;
      border-radius: 8px;
      background: var(--bg2);
      border: 1px solid var(--line);
      text-align: center;
    }
    .foot {
      padding: 32px 0 20px;
      text-align: center;
      color: var(--text-faint);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const TEAMS = [
      { id: 0, player: 'Nirmal', club: 'Barcelona', colors: ['#A50044', '#004D98'], ini: 'FCB' },
      { id: 1, player: 'Edwin', club: 'Bayern Munich', colors: ['#DC052D', '#0A2240'], ini: 'FCB' },
      { id: 2, player: 'Dino', club: 'Real Madrid', colors: ['#1B2A4A', '#C9A24B'], ini: 'RMA' },
      { id: 3, player: 'Amal', club: 'Paris Saint-Germain', colors: ['#001B5E', '#DA020E'], ini: 'PSG' },
      { id: 4, player: 'Aman', club: 'Monaco', colors: ['#E1000F', '#0B1E3D'], ini: 'ASM' },
      { id: 5, player: 'Prince', club: 'Borussia Dortmund', colors: ['#FDE100', '#1A1A1A'], ini: 'BVB' },
      { id: 6, player: 'THALA', club: 'Inter Milan', colors: ['#010E80', '#1A1A1A'], ini: 'INT' },
      { id: 7, player: 'Jinish', club: 'Manchester United', colors: ['#DA291C', '#1A1A1A'], ini: 'MUN' },
      { id: 8, player: 'Alen T', club: 'Brazil', colors: ['#FFDF00', '#009C3B'], ini: 'BRA' },
      { id: 9, player: 'Anil', club: 'Norway', colors: ['#EF2B2D', '#0B1E4D'], ini: 'NOR' }
    ];

    function buildCompletedFixtures() {
      const fixtures = [];
      let id = 0;
      for (let i = 0; i < TEAMS.length; i++) {
        for (let j = i + 1; j < TEAMS.length; j++) {
          const leg1Home = i;
          const leg1Away = j;
          const leg2Home = j;
          const leg2Away = i;

          const hs1 = 1 + ((i * 5 + j * 3 + 1) % 4);
          const as1 = 1 + ((j * 4 + i * 2 + 2) % 4);
          const hs2 = 1 + ((j * 5 + i * 3 + 2) % 4);
          const as2 = 1 + ((i * 4 + j * 2 + 1) % 4);

          fixtures.push({ id: id++, home: leg1Home, away: leg1Away, leg: 1, hs: hs1, as: as1 });
          fixtures.push({ id: id++, home: leg2Home, away: leg2Away, leg: 2, hs: hs2, as: as2 });
        }
      }
      return fixtures;
    }

    const FIXTURES = buildCompletedFixtures();

    function badge(team) {
      const grad = "linear-gradient(135deg, " + team.colors[0] + ", " + team.colors[1] + ")";
      return '<div class="team-badge" style="background:' + grad + ';">' + team.ini + '</div>';
    }

    function render() {
      const root = document.getElementById('root');

      const logoHtml = TEAMS.map(team => `
        <div class="team-card">
          ${badge(team)}
          <div class="meta">
            <div class="club">${team.club}</div>
            <div class="player">${team.player}</div>
          </div>
        </div>
      `).join('');

      const pairMap = {};
      FIXTURES.forEach(f => {
        const key = [Math.min(f.home, f.away), Math.max(f.home, f.away)].join('-');
        if (!pairMap[key]) pairMap[key] = [];
        pairMap[key].push(f);
      });

      const fixtureHtml = Object.keys(pairMap).map(key => {
        const [a, b] = key.split('-').map(Number);
        const t1 = TEAMS[a];
        const t2 = TEAMS[b];
        const matches = pairMap[key].sort((x, y) => x.leg - y.leg);

        return `
          <div class="fixture-pair">
            <div class="fixture-header">
              <span>${t1.player} vs ${t2.player}</span>
              <span>${t1.club} · ${t2.club}</span>
            </div>
            ${matches.map(match => {
              const homeTeam = TEAMS[match.home];
              const awayTeam = TEAMS[match.away];
              return `
                <div class="fixture-match">
                  <div class="team-side home">
                    ${badge(homeTeam)}
                    <div class="name">${homeTeam.player}</div>
                  </div>
                  <div class="score">
                    <span class="box">${match.hs}</span>
                    <span>:</span>
                    <span class="box">${match.as}</span>
                  </div>
                  <div class="team-side away">
                    ${badge(awayTeam)}
                    <div class="name">${awayTeam.player}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('');

      root.innerHTML = `
        <div class="hero">
          <div class="wrap">
            <h1>Sunday Super League <span class="sub">Season 2</span></h1>
            <div class="hero-meta">
              <div><span class="n">${TEAMS.length}</span><span class="l">Teams</span></div>
              <div><span class="n">${FIXTURES.length}</span><span class="l">Fixtures</span></div>
              <div><span class="n">${FIXTURES.filter(f => f.hs !== null).length}</span><span class="l">Played</span></div>
            </div>
          </div>
        </div>

        <div class="wrap">
          <section class="section">
            <div class="section-head">
              <h2>All team logos</h2>
              <p>Every club in the league</p>
            </div>
            <div class="logo-grid">${logoHtml}</div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>All fixtures</h2>
              <p>Full results for the season</p>
            </div>
            <div class="fixture-list">${fixtureHtml}</div>
          </section>

          <div class="foot">Sunday Super League · Season 2</div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
